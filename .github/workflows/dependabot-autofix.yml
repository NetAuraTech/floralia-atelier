name: Dependabot autofix

# Completes dependabot's own PRs so they pass CI without manual edits.
#
# Dependabot updates the live `package.json` files and the lockfile, but the
# two can drift on hoisting / range-mirror cases. This workflow converges the
# lockfile from the package manifests on every dependabot PR and commits the
# result back onto the PR branch. The PR's own CI then runs green and the PR
# is ready to merge.
#
# It runs on `pull_request_target` (not `pull_request`) because it must push
# back onto the PR head branch, which only a base-branch-token run may do. It
# is gated to PRs opened by `dependabot[bot]` from this repository (never a
# fork): dependabot only ever rewrites `package.json`/`package-lock.json`, so
# the tooling it executes on the PR head is byte-identical to `main`'s and no
# untrusted code runs.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync-manifests-and-lockfile:
    runs-on: ubuntu-latest
    # Same-PR runs are serialized so a re-triggered run (from our own commit)
    # never races a live one on the branch.
    concurrency:
      group: dependabot-autofix-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.0

      - name: Converge the lockfile
        # Resolves the ideal tree from the package manifests without installing
        # or running lifecycle scripts. A no-op when dependabot's lockfile is
        # already consistent; repairs the rarer hoisting / range-mirror cases.
        # --ignore-scripts: --package-lock-only still runs the root postinstall
        # (patch-package), whose binary is absent without node_modules.
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit and push if anything changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo 'Nothing to converge — the lockfile already matches the bump.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(deps): converge lockfile with dependabot bump"
          git push origin "HEAD:refs/heads/${TARGET_REF}"
